  <text x="64" y="428" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">upper : EInt = 1</text>
  <text x="64" y="452" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">→ type : Object [1..1]</text>

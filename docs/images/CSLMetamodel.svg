  <text x="64" y="684" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">→ generalization : Entity [0..1]</text>
  <rect x="520" y="600" width="420" height="124" rx="6" fill="#fffde8" stroke="#34465b" stroke-width="1.5"/>
  <line x1="520" y1="637" x2="940" y2="637" stroke="#34465b"/>

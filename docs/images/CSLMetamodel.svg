  <text x="1004" y="228" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">mutable : EBoolean = false</text>
  <text x="1004" y="252" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">defaultValue : EString</text>

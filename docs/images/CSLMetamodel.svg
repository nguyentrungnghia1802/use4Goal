  <rect x="990" y="830" width="420" height="124" rx="6" fill="#fffde8" stroke="#34465b" stroke-width="1.5"/>
  <line x1="990" y1="867" x2="1410" y2="867" stroke="#34465b"/>
  <text x="1004" y="855" font-family="sans-serif" font-size="17" fill="#182534" font-weight="bold">Invariant</text>
  <text x="1004" y="890" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">name : EString</text>
  <text x="1004" y="914" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">→ contextType : Object [1..1]</text>
  <text x="1004" y="938" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">oclBody : EString</text>
  <rect x="50" y="890" width="420" height="124" rx="6" fill="#ecf5e6" stroke="#34465b" stroke-width="1.5"/>

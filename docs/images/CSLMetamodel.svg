  <text x="64" y="974" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">AGGREGATION</text>
  <text x="64" y="998" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">COMPOSITION</text>
  <text x="45" y="1150" font-family="sans-serif" font-size="14" fill="#182534" font-weight="normal">◆ containment     → non-containment reference     * unbounded     inherited features appear in the superclass</text>
